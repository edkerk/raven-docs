site_name: RAVEN
site_description: >-
  Reconstruction, Analysis and Visualization of Metabolic Networks — the RAVEN
  Toolbox (MATLAB) and raven-toolbox, documented side by side.
site_author: Wang, Marcisauskas, Sanchez, Domenzain, Hermansson, Agren, Nielsen, Kerkhoven et al.
repo_url: https://github.com/SysBioChalmers/RAVEN
repo_name: SysBioChalmers/RAVEN
edit_uri: ""

# Build-time hooks that keep the site resilient to structural changes in the
# RAVEN / raven-toolbox submodules (folders or files added/removed on the
# tracked dev branches). See scripts/build_hooks.py.
hooks:
  - scripts/build_hooks.py
  # Aborts the build if a hand-written page names a function that does not
  # exist in either toolbox. See scripts/check_names.py.
  - scripts/check_names.py

plugins:
  - search
  # gen-files runs the generator at build time, emitting one API page per
  # shared category plus the literate-nav SUMMARY from the submodule sources.
  - gen-files:
      scripts:
        - scripts/gen_api_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        # Python API (raven-toolbox) -- collected statically by griffe from the
        # submodule source, so the package does not need to be installed.
        python:
          paths: [raven-toolbox/src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: false
            show_root_toc_entry: false
            show_source: false
            separate_signature: true
            show_signature_annotations: true
        # MATLAB API (RAVEN) -- pure-Python tree-sitter collection, no MATLAB
        # runtime required. Functions are referenced by name; paths are limited
        # to the documented user-facing categories so names stay unambiguous
        # (legacy/ and external/ are intentionally excluded).
        matlab:
          paths:
            - RAVEN/reconstruction
            - RAVEN/manipulation
            - RAVEN/analysis
            - RAVEN/gapfilling
            - RAVEN/INIT
            - RAVEN/annotation
            - RAVEN/biomass
            - RAVEN/curation
            - RAVEN/conversion
            - RAVEN/conditions
            - RAVEN/comparison
            - RAVEN/omics
            - RAVEN/localization
            - RAVEN/queries
            - RAVEN/io
            - RAVEN/solver
            - RAVEN/tasks
            - RAVEN/utils
          paths_recursive: true
          options:
            docstring_style: numpy
            show_root_heading: false
            show_root_toc_entry: false
            show_source: false

theme:
  name: material
  # Custom icons live under overrides/.icons/ and are referenced as
  # :custom-<name>: in markdown (e.g. :custom-matlab:).
  custom_dir: overrides
  logo: assets/raven-bird-white.png
  favicon: assets/raven-bird-navy.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.instant
    - navigation.footer
    - content.code.copy
    - content.tabs.link        # linked, persistent MATLAB/Python tabs site-wide
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  palette:
    # Brand colours (navy) are defined in docs/stylesheets/extra.css.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  # Renders Material icon/emoji shortcodes (e.g. :octicons-arrow-right-24:) as
  # inline SVG instead of literal text. material.extensions.emoji is the path
  # for mkdocs-material >= 9 (see requirements.txt). custom_icons registers
  # overrides/.icons so project icons like :custom-matlab: resolve (Material
  # does not auto-scan custom_dir/.icons).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation:
      - Overview: installation/index.md
      - RAVEN (MATLAB): installation/raven.md
      - raven-toolbox (Python): installation/python.md
  - MATLAB vs Python:
      - Overview: differences.md
      - Function mapping: matlab-vs-python.md
      - Only in raven-toolbox: python-only.md
      - Only in RAVEN: matlab-only.md
      - Same function, different answer: behaviour.md
      - What identical results means: parity.md
      - Changes from RAVEN 2: raven2-changes.md
  - Guides:
      - Overview: protocol/index.md
      - User guide:
          - Overview: guide/index.md
          - 1. Getting started: guide/getting-started.md
          - 2. Model structure and identifiers: guide/model-structure.md
          - 3. Reading and writing models: guide/io.md
          - 4. Simulating growth with FBA: guide/fba.md
          - 5. Growth media and conditions: guide/media.md
      - GEM reconstruction (H. polymorpha):
          - Introduction: protocol/reconstruction.md
          - Materials and installation: protocol/materials.md
          - Import template models: protocol/template-models.md
          - Draft from homology: protocol/homology.md
          - Biomass composition: protocol/biomass.md
          - Curation of lipid reactions: protocol/lipid-curation.md
          - Gap-filling: protocol/gap-filling.md
          - Save and simulate: protocol/simulation.md
          - Manual curation: protocol/manual-curation.md
          - Anticipated results: protocol/anticipated-results.md
      - Legacy tutorials:
          - Overview: tutorials/index.md
          - 1 - Import a GEM and run FBA: tutorials/tutorial1.md
          - 2 - Build a small model: tutorials/tutorial2.md
          - 3 - Knockouts, MOMA and omics: tutorials/tutorial3.md
          - 4 - Fix an erroneous model: tutorials/tutorial4.md
          - 5 - Reconstruct from KEGG: tutorials/tutorial5.md
  - API documentation: api/
  - References: references.md
